workflows:
  android-workflow:
    name: Android Release Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Check directory and build APK
        script: |
          # Periksa lokasi direktori
          echo "Current directory: $(pwd)"
          
          # Masuk ke folder project yang benar (menggunakan underscore)
          if [ -d "CND_Mobile_Android" ]; then
            cd CND_Mobile_Android
          fi
          
          # Pastikan file pubspec.yaml ditemukan
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml tidak ditemukan!"
            ls -la
            exit 1
          fi

          echo "Found pubspec.yaml, starting Flutter build..."
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
