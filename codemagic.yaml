workflows:
  android-native-workflow:
    name: Android Native Build APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      android_sdk: latest
      java: 17
    scripts:
      - name: Build Android APK (Gradle)
        script: |
          # Berikan izin eksekusi ke gradlew jika belum ada
          chmod +x gradlew
          
          # Jalankan build release APK menggunakan Gradle
          ./gradlew assembleRelease
    artifacts:
      - "app/build/outputs/apk/release/*.apk"
