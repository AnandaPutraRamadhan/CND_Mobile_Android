workflows:
  android-native-workflow:
    name: Android Native Build APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build Android APK (Gradle)
        script: |
          cd CND_Mobile_Android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "CND_Mobile_Android/app/build/outputs/apk/release/*.apk"
