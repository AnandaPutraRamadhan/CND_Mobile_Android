workflows:
  cnd-mobile-android:
    name: CND Mobile Android APK
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "id.co.cndmobile"
      java: 17
    scripts:
      - name: Download Gradle 8.9
        script: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug APK
        script: |
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
